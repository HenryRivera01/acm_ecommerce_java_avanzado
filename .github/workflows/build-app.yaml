name: "CI - Java, pruebas, PMD y GHCR"

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"

jobs:
  build:
    name: "1. Compilar aplicación"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java y caché de Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Permitir ejecución de Gradle
        run: chmod +x gradlew

      - name: Compilar y generar JAR
        run: ./gradlew clean bootJar --no-daemon

      - name: Guardar JAR para el job de Docker
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/app.jar
          if-no-files-found: error
          retention-days: 3

  test:
    name: "2. Ejecutar pruebas"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ secrets.DB_PORT }}
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - "5434:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java y caché de Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Verificar configuración sin mostrar secretos
        shell: bash
        run: |
          for variable in \
            DB_NAME \
            DB_USER \
            DB_PASSWORD \
            DB_PORT \
            SPRING_DATASOURCE_URL \
            SPRING_DATASOURCE_USERNAME \
            SPRING_DATASOURCE_PASSWORD
          do
            if [ -z "${!variable}" ]; then
              echo "Falta configurar la variable: $variable"
              exit 1
            fi
          done

          if [ "$DB_PORT" != "5434" ]; then
            echo "Este workflow requiere DB_PORT=5434."
            exit 1
          fi

          if [ "$DB_USER" != "$SPRING_DATASOURCE_USERNAME" ]; then
            echo "Los usuarios de PostgreSQL y Spring no coinciden."
            exit 1
          fi

          if [ "$DB_PASSWORD" != "$SPRING_DATASOURCE_PASSWORD" ]; then
            echo "Las contraseñas de PostgreSQL y Spring no coinciden."
            exit 1
          fi

          EXPECTED_URL="jdbc:postgresql://localhost:5434/$DB_NAME"

          if [ "$SPRING_DATASOURCE_URL" != "$EXPECTED_URL" ]; then
            echo "Revisa el host, puerto y nombre de base de datos del datasource."
            exit 1
          fi

          echo "Configuración presente y coherente."

      - name: Permitir ejecución de Gradle
        run: chmod +x gradlew

      - name: Ejecutar pruebas
        run: ./gradlew test --no-daemon

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 7

  analysis:
    name: "3. Análisis estático con PMD"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java y caché de Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Permitir ejecución de Gradle
        run: chmod +x gradlew

      - name: Analizar código principal y de pruebas
        run: ./gradlew pmdMain pmdTest --no-daemon

      - name: Guardar reportes de PMD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-reports
          path: build/reports/pmd/
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: "4. Construir y publicar imagen"
    needs:
      - build
      - test
      - analysis

    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Recuperar el JAR compilado
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: build/libs

      - name: Verificar que existe el JAR
        run: test -f build/libs/app.jar

      - name: Calcular nombre y etiquetas de imagen
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          IMAGE_NAME="ghcr.io/${REPOSITORY,,}"
          SHORT_SHA="${HEAD_SHA:0:7}"

          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
